<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" role="img">
  <title>Theme aware labels</title>
  <style>
    .box { fill: #ffffff; stroke: #d1d5db; }
    .label { fill: #1f2937; font: 14px sans-serif; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #1f2937; stroke: #4b5563; }
      .label { fill: #f9fafb; }
    }
  </style>
  <rect class="box" x="20" y="20" width="260" height="80" rx="10"/>
  <text class="label" x="150" y="65" text-anchor="middle">Follows the theme</text>
</svg>
