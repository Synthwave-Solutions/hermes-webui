<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 160" role="img">
  <title>Card with a soft shadow</title>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset in="blur" dx="0" dy="3" result="offset"/>
      <feFlood flood-color="#000000" flood-opacity="0.25" result="tint"/>
      <feComposite in="tint" in2="offset" operator="in" result="shade"/>
      <feMerge><feMergeNode in="shade"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="drop"><feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/></filter>
  </defs>
  <rect x="40" y="30" width="220" height="100" rx="12" fill="var(--sp-surface,#f3f4f6)" filter="url(#shadow)"/>
  <text x="150" y="86" font-size="16" text-anchor="middle" fill="var(--sp-fg,#1f2937)" filter="url(#drop)">Summary</text>
</svg>
