<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" role="img">
  <title>Masked stripes</title>
  <defs>
    <pattern id="stripes" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="5" height="10" fill="var(--sp-accent,#f97316)"/>
    </pattern>
    <clipPath id="round"><circle cx="75" cy="75" r="60"/></clipPath>
    <mask id="fade"><rect width="300" height="150" fill="white"/><rect x="150" width="150" height="150" fill="gray"/></mask>
  </defs>
  <rect width="150" height="150" fill="url(#stripes)" clip-path="url(#round)"/>
  <rect x="160" y="20" width="120" height="110" fill="var(--sp-fg,#1f2937)" mask="url(#fade)"/>
</svg>
