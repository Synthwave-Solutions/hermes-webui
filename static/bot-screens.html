<!doctype html><html lang="nl" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bot Screens · SynthPulse</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/bot-screens.css"></head>
<body class="screen-page"><header class="screen-header"><a href="/" id="back">← SynthPulse</a><h1>Bot Screens</h1><label><span class="sr-only">Bot</span><select id="bot" aria-label="Bot"></select></label><span id="status" role="status"></span><select id="language" aria-label="Taal / Language"><option value="nl">Nederlands</option><option value="en">English</option></select><button id="guide"></button></header>
<nav class="screen-controls" aria-label="Screen controls"><button id="start"></button><button id="takeover"></button><button id="release"></button><button id="reconnect"></button><button id="fullscreen"></button><button id="recover" hidden></button><button id="stop"></button></nav>
<p id="error" role="alert" hidden></p><main id="screenArea"><div id="display"></div><div id="empty" role="status"></div></main><footer id="hint"></footer>
<aside id="tour" hidden aria-label="Interactive guide"><strong id="tourTitle"></strong><p id="tourText"></p><div><button id="tourBack"></button><button id="tourNext"></button><button id="tourClose"></button></div></aside>
<dialog id="confirmDialog"><form method="dialog"><h2 id="confirmTitle"></h2><p id="confirmText"></p><div><button value="cancel" id="cancel"></button><button value="ok" id="confirm"></button></div></form></dialog>
<script type="module" src="/static/bot-screens.js"></script></body></html>
